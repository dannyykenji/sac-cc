# Profile "test": H2 em modo PostgreSQL com as MESMAS migrações Flyway (ADR-003).
# Locations ficam no application.yml com o placeholder {vendor}: no H2, db/migration/h2
# não existe e é ignorado — V004 (índice parcial, só PostgreSQL) não roda nos testes;
# a anti-duplicação nos testes é garantida pelo lock pessimista (ADR-005).
spring.datasource.url=jdbc:h2:mem:saccc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
